<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tournoi des Sorciers ⚡</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080510; }
    @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes slideDown { from{transform:translateY(-12px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes shimmer { 0%{background-position:200% center} 100%{background-position:-200% center} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .btn{cursor:pointer;border:none;transition:all 0.2s;}
    .btn:hover{filter:brightness(1.12);transform:translateY(-1px);}
    .btn:active{transform:translateY(0);filter:brightness(0.95);}
    .gold-text{background:linear-gradient(135deg,#8B6914,#C9A84C,#E8D070,#C9A84C,#8B6914);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;}
    input,select,textarea{outline:none;}
    input::placeholder,textarea::placeholder{color:rgba(180,160,120,0.35);}
    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-track{background:#080510;}
    ::-webkit-scrollbar-thumb{background:#4a3a1a;border-radius:2px;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const SUPABASE_URL = "https://xtjndtjrbqyskabtmcez.supabase.co";
const SUPABASE_KEY = "sb_publishable_ExmxO4mnXHaMeNaa4dUgxA_PQGkzqjD";
// Telegram via Supabase Edge Function — token jamais dans le code
const ADMIN_PASSWORD = "alohomora";

const GRYF_IMG = "https://logos-marques.com/wp-content/uploads/2022/03/Gryffindor-Logo.jpg";
const SLYT_IMG = "https://toppng.com/uploads/preview/blason-harry-potter-serpentard-115630567769muivysvmp.png";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const sendTelegram = async (msg) => {
  if (!msg || !msg.trim()) return;
  try {
    await fetch(`${SUPABASE_URL}/functions/v1/send-telegram`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${SUPABASE_KEY}`,
      },
      body: JSON.stringify({ message: msg }),
    });
  } catch {}
};

const HOUSES = {
  gryffondor: { name: "Gryffondor", colors: { primary: "#7B0000", secondary: "#C9A84C", accent: "#E8C860", border: "#C9A84C" }, img: GRYF_IMG },
  serpentard: { name: "Serpentard", colors: { primary: "#0D3D1E", secondary: "#8B9B6A", accent: "#BBBF8A", border: "#7A956A" }, img: SLYT_IMG },
};

const DEFAULT_ACTIVITIES = [
  { title: "Cours de Potions", description: "Préparez la potion parfaite sans exploser votre chaudron !", points: 100, revealed: false, status: "hidden" },
  { title: "Quidditch des Salons", description: "Match de Quidditch revisité — balais non inclus.", points: 150, revealed: false, status: "hidden" },
  { title: "Défi des Sortilèges", description: "Le duel de magie commence. Que le meilleur gagne !", points: 120, revealed: false, status: "hidden" },
  { title: "Énigme de la Chambre Secrète", description: "Résolvez les indices avant que la porte ne se referme…", points: 200, revealed: false, status: "hidden" },
  { title: "Bal de Poudlard", description: "Élégance, danse et magie — la grande finale !", points: 180, revealed: false, status: "hidden" },
];

const STARS = Array.from({ length: 60 }, (_, i) => ({
  id: i, x: Math.random() * 100, y: Math.random() * 100,
  r: Math.random() * 1.5 + 0.5, del: Math.random() * 5, dur: Math.random() * 3 + 2,
}));

const Divider = ({ color = "#C9A84C" }) => (
  <svg viewBox="0 0 300 20" style={{width:"100%",height:16,display:"block",margin:"12px 0"}}>
    <line x1="0" y1="10" x2="110" y2="10" stroke={color} strokeWidth="0.8" opacity="0.5"/>
    <polygon points="120,10 130,5 140,10 130,15" fill="none" stroke={color} strokeWidth="0.8" opacity="0.8"/>
    <polygon points="150,4 155,10 150,16 145,10" fill={color} opacity="0.9"/>
    <polygon points="160,10 170,5 180,10 170,15" fill="none" stroke={color} strokeWidth="0.8" opacity="0.8"/>
    <line x1="190" y1="10" x2="300" y2="10" stroke={color} strokeWidth="0.8" opacity="0.5"/>
  </svg>
);

const Corner = ({ flip = false, color = "#C9A84C" }) => (
  <svg viewBox="0 0 40 40" width="32" height="32" style={{opacity:0.6,transform:flip?"scaleX(-1)":"none"}}>
    <path d="M2,38 L2,8 Q2,2 8,2 L38,2" fill="none" stroke={color} strokeWidth="1.2"/>
    <circle cx="8" cy="8" r="3" fill="none" stroke={color} strokeWidth="1"/>
    <circle cx="2" cy="2" r="1.5" fill={color}/>
  </svg>
);

function App() {
  const [tab, setTab] = useState("scores");
  const [history, setHistory] = useState([]);
  const [participants, setParticipants] = useState({ gryffondor: [], serpentard: [] });
  const [activities, setActivities] = useState([]);
  const [feed, setFeed] = useState([]);
  const [isAdmin, setIsAdmin] = useState(false);
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [adminPwInput, setAdminPwInput] = useState("");
  const [adminError, setAdminError] = useState(false);

  const [form, setForm] = useState({ house: "gryffondor", points: "", author: "", reason: "", type: "add" });
  const [postForm, setPostForm] = useState({ author: "", text: "", imgUrl: "" });
  const [activityForm, setActivityForm] = useState({ title: "", description: "", points: "" });
  const [setupForm, setSetupForm] = useState({ name: "", house: "gryffondor" });
  const [toast, setToast] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [victoryScreen, setVictoryScreen] = useState(false);
  const [loading, setLoading] = useState(true);

  // ── Load data ──
  const _defaultsInserted = React.useRef(false);
  const loadAll = async () => {
    const [h, a, f, p] = await Promise.all([
      sb.from("history").select("*").order("created_at", { ascending: false }),
      sb.from("activities").select("*").order("created_at", { ascending: true }),
      sb.from("feed").select("*").order("created_at", { ascending: false }),
      sb.from("participants").select("*"),
    ]);
    if (h.data) setHistory(h.data);
    if (a.data && a.data.length === 0 && !_defaultsInserted.current) {
      _defaultsInserted.current = true;
      await sb.from("activities").insert(DEFAULT_ACTIVITIES);
      const a2 = await sb.from("activities").select("*").order("created_at", { ascending: true });
      if (a2.data) setActivities(a2.data);
    } else if (a.data) setActivities(a.data);
    if (f.data) setFeed(f.data);
    if (p.data) {
      const parts = { gryffondor: [], serpentard: [] };
      p.data.forEach(x => { if (parts[x.house]) parts[x.house].push(x.name); });
      setParticipants(parts);
    }
    setLoading(false);
  };

  useEffect(() => {
    loadAll();
    // Realtime — délai 2s pour éviter les faux événements au démarrage
    let ch;
    const timer = setTimeout(() => {
      ch = sb.channel("tournoi")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "history" }, () => loadAll())
        .on("postgres_changes", { event: "DELETE", schema: "public", table: "history" }, () => loadAll())
        .on("postgres_changes", { event: "*", schema: "public", table: "activities" }, () => loadAll())
        .on("postgres_changes", { event: "*", schema: "public", table: "feed" }, () => loadAll())
        .on("postgres_changes", { event: "*", schema: "public", table: "participants" }, () => loadAll())
        .subscribe();
    }, 2000);
    return () => { clearTimeout(timer); if (ch) sb.removeChannel(ch); };
  }, []);

  const showToast = (msg, type = "success") => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500); };

  const scores = {
    gryffondor: history.filter(e => e.house === "gryffondor").reduce((s, e) => s + e.delta, 0),
    serpentard: history.filter(e => e.house === "serpentard").reduce((s, e) => s + e.delta, 0),
  };

  const handleAdminLogin = () => {
    if (adminPwInput === ADMIN_PASSWORD) {
      setIsAdmin(true); setShowAdminLogin(false); setAdminPwInput(""); setAdminError(false);
      showToast("Mode admin activé ✦");
    } else setAdminError(true);
  };

  const handleAddPoints = async () => {
    const pts = parseInt(form.points);
    if (!pts || isNaN(pts) || pts <= 0) return showToast("Nombre de points invalide", "error");
    if (!form.author.trim()) return showToast("Qui attribue ces points ?", "error");
    const delta = form.type === "add" ? pts : -pts;
    const ts = new Date().toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const { error } = await sb.from("history").insert({
      house: form.house, delta, author: form.author.trim(),
      reason: form.reason.trim() || "—", ts,
    });
    if (error) return showToast("Erreur de connexion", "error");

    // Calcul nouveaux scores pour notif
    const newScoreG = scores.gryffondor + (form.house === "gryffondor" ? delta : 0);
    const newScoreS = scores.serpentard + (form.house === "serpentard" ? delta : 0);
    const emoji = delta > 0 ? "⚡" : "💀";
    const houseEmoji = form.house === "gryffondor" ? "🦁" : "🐍";
    await sendTelegram(
      `${emoji} <b>${delta > 0 ? "+" : ""}${delta} points pour ${HOUSES[form.house].name}</b> ${houseEmoji}\n` +
      `Par <b>${form.author.trim()}</b>${form.reason.trim() ? ` · ${form.reason.trim()}` : ""}\n\n` +
      `🏆 Scores : 🦁 ${newScoreG} pts | 🐍 ${newScoreS} pts`
    );

    setForm(f => ({ ...f, points: "", reason: "", author: "" }));
    showToast(delta > 0 ? `+${delta} pts pour ${HOUSES[form.house].name} !` : `${delta} pts infligés`);
    setTab("scores");
  };

  const handleDeleteHistory = async (id) => {
    await sb.from("history").delete().eq("id", id);
    setDeleteConfirm(null);
    showToast("Opération supprimée");
  };

  const handleAddPost = async () => {
    if (!postForm.text.trim() && !postForm.imgUrl.trim()) return showToast("Écris quelque chose !", "error");
    if (!postForm.author.trim()) return showToast("Ton prénom ?", "error");
    const ts = new Date().toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    await sb.from("feed").insert({ author: postForm.author.trim(), content: postForm.text.trim(), img_url: postForm.imgUrl.trim(), ts });
    const postMsg = postForm.text.trim() ? `📸 <b>${postForm.author.trim()}</b> a publié une actu !\n${postForm.text.trim()}` : `📸 <b>${postForm.author.trim()}</b> a partagé une photo !`;
    await sendTelegram(postMsg);
    setPostForm({ author: "", text: "", imgUrl: "" });
    showToast("Publié !");
  };

  const handleAddParticipant = async () => {
    if (!setupForm.name.trim()) return showToast("Un prénom ?", "error");
    await sb.from("participants").insert({ name: setupForm.name.trim(), house: setupForm.house });
    setSetupForm(f => ({ ...f, name: "" }));
    showToast(`${setupForm.name} rejoint ${HOUSES[setupForm.house].name} !`);
  };

  const handleRemoveParticipant = async (name, house) => {
    await sb.from("participants").delete().eq("name", name).eq("house", house);
  };

  const totalAbs = Math.abs(scores.gryffondor) + Math.abs(scores.serpentard);
  const gPercent = totalAbs === 0 ? 50 : Math.max(5, Math.min(95, (scores.gryffondor / totalAbs) * 100));
  const revealedActivities = activities.filter(a => a.revealed);
  const hiddenActivities = activities.filter(a => !a.revealed);
  const statusColor = { upcoming: "#C9A84C", ongoing: "#7DBF6E", done: "#6B7A5E" };
  const statusLabel = { upcoming: "À venir", ongoing: "En cours", done: "Terminée" };

  const inputStyle = {
    width:"100%", padding:"11px 16px", borderRadius:4, fontSize:14,
    background:"rgba(10,6,20,0.7)", border:"1px solid rgba(180,150,80,0.3)",
    color:"#E8D8B0", boxSizing:"border-box", fontFamily:"'Crimson Text',serif",
  };
  const cardStyle = {
    background:"linear-gradient(160deg,rgba(20,12,35,0.97),rgba(10,6,20,0.99))",
    border:"1px solid rgba(180,150,80,0.25)", borderRadius:6,
    padding:"20px 18px", marginBottom:12,
    boxShadow:"0 4px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(200,168,76,0.1)",
  };

  if (loading) return (
    <div style={{minHeight:"100vh",background:"#080510",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{fontSize:48,animation:"floatY 2s ease-in-out infinite"}}>⚡</div>
      <p className="gold-text" style={{fontFamily:"'Cinzel Decorative',serif",fontSize:16,letterSpacing:2}}>Chargement…</p>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#080510",fontFamily:"serif",position:"relative",overflow:"hidden"}}>
      <svg style={{position:"fixed",inset:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:0}} preserveAspectRatio="none">
        {STARS.map(s => (
          <circle key={s.id} cx={`${s.x}%`} cy={`${s.y}%`} r={s.r} fill="white" opacity="0">
            <animate attributeName="opacity" values="0.1;0.7;0.1" dur={`${s.dur}s`} begin={`${s.del}s`} repeatCount="indefinite"/>
          </circle>
        ))}
      </svg>
      <div style={{position:"fixed",bottom:0,left:0,right:0,height:"30vh",background:"linear-gradient(to top,rgba(20,5,40,0.4),transparent)",pointerEvents:"none",zIndex:0}}/>

      {/* Toast */}
      {toast && (
        <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",zIndex:2000,
          background:toast.type==="error"?"rgba(90,10,10,0.97)":"rgba(10,40,20,0.97)",
          color:"#E8D8B0",padding:"11px 22px",borderRadius:4,
          border:`1px solid ${toast.type==="error"?"rgba(180,60,60,0.5)":"rgba(80,160,80,0.4)"}`,
          fontFamily:"'Crimson Text',serif",fontSize:15,animation:"slideDown 0.25s ease",
          boxShadow:"0 4px 24px rgba(0,0,0,0.7)",whiteSpace:"nowrap",zIndex:3000}}>
          {toast.msg}
        </div>
      )}

      {/* Delete confirm */}
      {deleteConfirm && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:2999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{...cardStyle,maxWidth:320,width:"100%",textAlign:"center",border:"1px solid rgba(200,160,70,0.4)"}}>
            <div style={{fontSize:32,marginBottom:10}}>✦</div>
            <p style={{color:"#C9A84C",fontFamily:"'Cinzel',serif",fontSize:14,letterSpacing:1,marginBottom:6}}>ANNULER L'OPÉRATION ?</p>
            <p style={{color:"#8a7a6a",fontSize:13,fontStyle:"italic",marginBottom:20}}>Cette action est irréversible.</p>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button className="btn" onClick={() => handleDeleteHistory(deleteConfirm)}
                style={{background:"rgba(90,10,10,0.8)",color:"#E8C0B0",padding:"10px 22px",borderRadius:4,fontSize:13,fontFamily:"'Cinzel',serif",border:"1px solid rgba(180,60,60,0.3)"}}>
                Supprimer
              </button>
              <button className="btn" onClick={() => setDeleteConfirm(null)}
                style={{background:"rgba(30,20,50,0.8)",color:"#8a7a9a",padding:"10px 22px",borderRadius:4,fontSize:13,fontFamily:"'Cinzel',serif",border:"1px solid rgba(100,80,130,0.3)"}}>
                Annuler
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Admin login */}
      {showAdminLogin && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:2999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{...cardStyle,maxWidth:320,width:"100%",textAlign:"center",border:"1px solid rgba(200,160,70,0.35)"}}>
            <div style={{fontSize:36,marginBottom:10}}>🔮</div>
            <p className="gold-text" style={{fontFamily:"'Cinzel',serif",fontSize:15,letterSpacing:2,marginBottom:4}}>MODE ADMIN</p>
            <Divider/>
            <input type="password" placeholder="Mot de passe secret…" value={adminPwInput}
              onChange={e => { setAdminPwInput(e.target.value); setAdminError(false); }}
              onKeyDown={e => e.key==="Enter" && handleAdminLogin()}
              style={{...inputStyle,marginBottom:adminError?6:16,border:`1px solid ${adminError?"rgba(200,60,60,0.5)":"rgba(180,150,80,0.3)"}`,textAlign:"center",letterSpacing:3}}/>
            {adminError && <p style={{color:"rgba(220,80,80,0.9)",fontSize:12,marginBottom:14,fontStyle:"italic"}}>Mot de passe incorrect</p>}
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button className="btn" onClick={handleAdminLogin}
                style={{background:"linear-gradient(135deg,rgba(40,25,70,0.9),rgba(60,40,100,0.9))",color:"#C9A84C",padding:"11px 26px",borderRadius:4,fontSize:13,fontFamily:"'Cinzel',serif",border:"1px solid rgba(200,160,70,0.35)",letterSpacing:1}}>
                Entrer
              </button>
              <button className="btn" onClick={() => { setShowAdminLogin(false); setAdminPwInput(""); setAdminError(false); }}
                style={{background:"transparent",color:"#6a5a7a",padding:"11px 22px",borderRadius:4,fontSize:13,fontFamily:"'Cinzel',serif",border:"1px solid rgba(100,80,120,0.25)"}}>
                Annuler
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Victory */}
      {victoryScreen && (
        <div style={{position:"fixed",inset:0,background:"rgba(5,2,12,0.97)",zIndex:2998,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{textAlign:"center",animation:"fadeIn 0.6s ease",maxWidth:360}}>
            <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:11,color:"rgba(200,160,70,0.5)",letterSpacing:4,marginBottom:16}}>COUPE DES DEUX MAISONS</div>
            {scores.gryffondor !== scores.serpentard ? (
              <div>
                <p style={{color:"rgba(180,150,80,0.6)",fontFamily:"'Cinzel',serif",fontSize:11,letterSpacing:3,marginBottom:20}}>MAISON VICTORIEUSE</p>
                <img src={scores.gryffondor > scores.serpentard ? GRYF_IMG : SLYT_IMG}
                  style={{height:180,width:"auto",maxWidth:200,objectFit:"contain",animation:"floatY 3s ease-in-out infinite",filter:"drop-shadow(0 0 30px rgba(200,160,70,0.6))",display:"block",margin:"0 auto"}} alt=""/>
                <h1 className="gold-text" style={{fontFamily:"'Cinzel Decorative',serif",fontSize:28,fontWeight:700,margin:"20px 0 8px",letterSpacing:2}}>
                  {scores.gryffondor > scores.serpentard ? "Gryffondor" : "Serpentard"}
                </h1>
                <Divider/>
                <p style={{color:"rgba(200,180,130,0.7)",fontFamily:"'Crimson Text',serif",fontSize:16,fontStyle:"italic"}}>
                  {Math.abs(scores.gryffondor - scores.serpentard)} points d'avance
                </p>
              </div>
            ) : (
              <div>
                <h1 className="gold-text" style={{fontFamily:"'Cinzel Decorative',serif",fontSize:24,margin:"20px 0"}}>Égalité Parfaite</h1>
                <p style={{color:"rgba(200,180,130,0.7)",fontStyle:"italic"}}>Les deux maisons terminent à égalité</p>
              </div>
            )}
            <button className="btn" onClick={() => setVictoryScreen(false)}
              style={{marginTop:28,background:"transparent",color:"rgba(150,130,90,0.7)",padding:"10px 24px",borderRadius:4,fontSize:12,fontFamily:"'Cinzel',serif",border:"1px solid rgba(150,120,60,0.3)",letterSpacing:1}}>
              FERMER
            </button>
          </div>
        </div>
      )}

      <div style={{position:"relative",zIndex:1,maxWidth:480,margin:"0 auto",padding:"0 0 100px"}}>

        {/* HEADER */}
        <div style={{textAlign:"center",padding:"36px 24px 20px",position:"relative"}}>
          <div style={{position:"absolute",top:36,left:16,opacity:0.5}}><Corner color="#C9A84C"/></div>
          <div style={{position:"absolute",top:36,right:66,opacity:0.5}}><Corner flip color="#C9A84C"/></div>
          <p style={{fontFamily:"'Cinzel Decorative',serif",fontSize:9,color:"rgba(201,168,76,0.5)",letterSpacing:4,marginBottom:8}}>Poudlard — Tournoi Officiel</p>
          <h1 className="gold-text" style={{fontFamily:"'Cinzel Decorative',serif",fontSize:22,fontWeight:700,margin:"0 0 6px",letterSpacing:1,lineHeight:1.2}}>
            Tournoi des Sorciers
          </h1>
          <Divider color="#C9A84C"/>
          <p style={{color:"rgba(180,160,120,0.5)",fontFamily:"'Crimson Text',serif",fontSize:13,margin:0,fontStyle:"italic"}}>
            Coupe des Deux Maisons
          </p>
          <div style={{position:"absolute",top:40,right:16}}>
            {isAdmin ? (
              <button className="btn" onClick={() => { setIsAdmin(false); showToast("Mode admin désactivé"); }}
                style={{background:"rgba(40,28,8,0.8)",color:"rgba(201,168,76,0.9)",padding:"5px 12px",borderRadius:3,fontSize:10,border:"1px solid rgba(200,160,70,0.3)",fontFamily:"'Cinzel',serif"}}>
                ✦ ADMIN
              </button>
            ) : (
              <button className="btn" onClick={() => setShowAdminLogin(true)}
                style={{background:"transparent",color:"rgba(100,80,60,0.4)",padding:"5px 10px",borderRadius:3,fontSize:14,border:"1px solid rgba(100,80,60,0.15)"}}>
                ⚙
              </button>
            )}
          </div>

                style={{...inputStyle,marginBottom:10}}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
                {["gryffondor","serpentard"].map(h => (
                  <button key={h} className="btn" onClick={() => setSetupForm(f=>({...f,house:h}))}
                    style={{padding:"10px",borderRadius:4,fontSize:11,fontFamily:"'Cinzel',serif",
                      background:setupForm.house===h?`rgba(${h==="gryffondor"?"80,5,5":"5,40,18"},0.7)`:"rgba(15,10,25,0.4)",
                      color:setupForm.house===h?HOUSES[h].colors.accent:"rgba(150,130,100,0.4)",
                      border:`1px solid ${setupForm.house===h?HOUSES[h].colors.border+"44":"rgba(150,120,80,0.12)"}`}}>
                    {HOUSES[h].name}
                  </button>
                ))}
              </div>
              <button className="btn" onClick={handleAddParticipant}
                style={{width:"100%",padding:"12px",borderRadius:4,fontSize:11,fontFamily:"'Cinzel',serif",letterSpacing:1,
                  background:"rgba(40,25,8,0.8)",color:"#C9A84C",border:"1px solid rgba(200,160,70,0.3)"}}>
                + AJOUTER
              </button>
            </div>
            {["gryffondor","serpentard"].map(h => (
              <div key={h} style={{...cardStyle,border:`1px solid ${HOUSES[h].colors.border}22`}}>
                <p style={{color:HOUSES[h].colors.secondary,fontFamily:"'Cinzel',serif",fontSize:12,letterSpacing:1,marginBottom:12}}>
                  {HOUSES[h].name.toUpperCase()} ({participants[h].length})
                </p>
                {participants[h].length === 0
                  ? <p style={{color:"rgba(120,100,60,0.3)",fontSize:13,fontStyle:"italic"}}>Aucun participant</p>
                  : participants[h].map(name => (
                    <div key={name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"8px 0",borderBottom:"1px solid rgba(150,120,60,0.08)"}}>
                      <span style={{color:"#D8C890",fontSize:14,fontFamily:"'Crimson Text',serif"}}>{name}</span>
                      <button onClick={() => handleRemoveParticipant(name, h)}
                        style={{background:"none",border:"none",cursor:"pointer",color:"rgba(180,80,80,0.3)",fontSize:13,transition:"color 0.15s"}}
                        onMouseEnter={ev=>ev.target.style.color="rgba(200,80,80,0.7)"}
                        onMouseLeave={ev=>ev.target.style.color="rgba(180,80,80,0.3)"}>✕</button>
                    </div>
                  ))
                }
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
